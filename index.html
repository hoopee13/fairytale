<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>별빛 동화 사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Noto+Serif+KR:wght@600&display=swap">
<style>
/* 레이아웃: 동화책 표지를 펼치듯 하늘 → 성 → 꽃밭 → 책장 순으로 흐르는 단일 세로 컬럼. 결과는 한 권의 책(한 장의 종이)에 장(章)으로 이어 붙인다. */
:root{
  --sky-1:#bcdaf6; --sky-2:#e4f0fc; --sky-3:#fbf7f0;
  --bg:#fbf7f0; --paper:#fffdf8; --paper-2:#f4effb;
  --ink:#2d3158; --ink-soft:#585d8e; --royal:#5f4cc6; --rose:#d68fc2;
  --gold:#b68d42; --gold-soft:#e6d4a3; --line:rgba(95,76,198,.18);
  --roof:#8ea4e8; --tower:rgba(255,255,255,.82);
  --btn-a:#5846c2; --btn-b:#a85aa6;
  --e0:#a9d8b4; --e1:#f4a99b; --e2:#ecd08e; --e3:#cdd6e6; --e4:#9bbcf0;
  --on-e:#2a2d52;
  --shadow:0 12px 34px rgba(90,80,170,.14);
  --f-display:'Nanum Myeongjo','Noto Serif KR',serif;
  --f-body:'Gowun Batang','Noto Serif KR',Georgia,serif;
  --f-latin:'Cormorant Garamond',Georgia,serif;
  --f-hanja:'Noto Serif KR','Nanum Myeongjo',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-1:#171c4a; --sky-2:#34357c; --sky-3:#12163a;
    --bg:#12163a; --paper:#1b2050; --paper-2:#242a62;
    --ink:#eef0ff; --ink-soft:#b9bde8; --royal:#b7a9ff; --rose:#f0a9d8;
    --gold:#e3c27a; --gold-soft:#6d5b36; --line:rgba(190,180,255,.22);
    --roof:#7f94e0; --tower:rgba(226,228,255,.88);
    --shadow:0 12px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-1:#171c4a; --sky-2:#34357c; --sky-3:#12163a;
  --bg:#12163a; --paper:#1b2050; --paper-2:#242a62;
  --ink:#eef0ff; --ink-soft:#b9bde8; --royal:#b7a9ff; --rose:#f0a9d8;
  --gold:#e3c27a; --gold-soft:#6d5b36; --line:rgba(190,180,255,.22);
  --roof:#7f94e0; --tower:rgba(226,228,255,.88);
  --shadow:0 12px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--royal);outline-offset:3px}
.wrap{width:min(100%,680px);margin-inline:auto;padding-inline:16px}

/* ---------- 표지 ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 62%,var(--sky-3) 100%);padding-block:52px 150px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:
   radial-gradient(60% 22% at 15% 16%,rgba(255,255,255,.85),transparent 70%),
   radial-gradient(50% 18% at 85% 8%,rgba(255,255,255,.7),transparent 70%),
   radial-gradient(70% 20% at 60% 52%,rgba(255,255,255,.55),transparent 72%),
   radial-gradient(40% 16% at 8% 60%,rgba(255,255,255,.5),transparent 72%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero::before{opacity:.18}}
:root[data-theme="dark"] .hero::before{opacity:.18}
.castle{position:absolute;right:-4%;bottom:70px;width:min(64%,420px);height:auto;opacity:.92;z-index:-1}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:100%}
.crown{width:54px;height:auto;margin-bottom:4px}
.kicker{font-family:var(--f-body);font-size:.95rem;color:var(--ink-soft);letter-spacing:.04em}
.title{font-family:var(--f-display);font-weight:800;line-height:1.08;letter-spacing:-.01em;font-size:clamp(2.7rem,13vw,4.6rem);
  background:linear-gradient(180deg,#8566ee 0%,#c46ec6 62%,#f08fbd 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 0 14px rgba(255,255,255,.95));margin-block:6px 4px}
.title span{display:block}
.title .sm{font-size:.62em;letter-spacing:.2em;padding-left:.1em}
.sub{max-width:21em;color:var(--ink);font-size:1rem}
.spark{position:absolute;width:18px;height:18px;color:#fff;opacity:.9;animation:tw 3.4s ease-in-out infinite}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spark{color:var(--gold)}}
:root[data-theme="dark"] .spark{color:var(--gold)}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.1);opacity:1}}
#garden{position:absolute;left:0;bottom:0;width:100%;height:170px;z-index:1;pointer-events:none}

/* ---------- 입력 카드 ---------- */
.form-card{position:relative;z-index:3;margin-top:-86px;background:var(--paper);border-radius:30px 30px 22px 22px;
  box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--gold-soft),var(--shadow);padding:26px 20px 24px}
.form-card h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--royal);text-wrap:balance}
.form-card .lead{color:var(--ink-soft);font-size:.95rem;margin-top:4px}
form{display:grid;gap:16px;margin-top:18px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lab{font-size:.85rem;color:var(--ink-soft);letter-spacing:.03em}
input[type=text],input[type=date],input[type=time]{width:100%;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-family:var(--f-body);font-size:1rem}
input:disabled{opacity:.45}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink-soft);cursor:pointer;width:max-content;max-width:100%}
.check input{width:18px;height:18px;accent-color:var(--royal)}
.go{height:54px;border:0;border-radius:999px;cursor:pointer;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:.04em;
  background:linear-gradient(100deg,var(--btn-a),var(--btn-b));box-shadow:0 8px 22px rgba(120,80,190,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go:active{transform:translateY(1px)}
.err{min-height:1.4em;font-size:.9rem;color:#b3395f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#ff9db9}}
:root[data-theme="dark"] .err{color:#ff9db9}
.fine{font-size:.8rem;color:var(--ink-soft)}

/* ---------- 결과: 한 권의 책 ---------- */
#result{padding-block:34px 20px}
.book{position:relative;background:var(--paper);border-radius:26px;box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--gold-soft),var(--shadow);overflow:hidden}
.ribbon{background:linear-gradient(100deg,var(--btn-a),var(--btn-b));color:#fff;text-align:center;font-size:.85rem;padding:7px 12px;letter-spacing:.03em}
.cover{position:relative;text-align:center;padding:40px 20px 32px;background:linear-gradient(180deg,var(--sky-1),var(--paper));isolation:isolate}
.cover .spark{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cover .spark{color:var(--gold)}}
:root[data-theme="dark"] .cover .spark{color:var(--gold)}
.cover .eyebrow{font-family:var(--f-latin);font-style:italic;font-size:1.05rem;color:var(--ink-soft);letter-spacing:.08em}
.cover .who{font-size:1rem;color:var(--ink);margin-top:2px}
.cover h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,8.5vw,2.7rem);line-height:1.2;margin-block:10px 8px;text-wrap:balance;
  background:linear-gradient(180deg,#8566ee,#c46ec6 70%,#ee8fbd);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 0 10px rgba(255,255,255,.8))}
.cover .ilji{display:inline-flex;gap:10px;align-items:center;font-family:var(--f-hanja);font-weight:600;color:var(--ink);padding:4px 16px;border:1px solid var(--gold-soft);border-radius:999px;background:var(--paper)}
.cover .line{margin:14px auto 0;max-width:24em;color:var(--ink)}
.sec{padding:30px 20px;border-top:1px solid var(--line)}
.sec h3{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--royal);display:flex;align-items:center;gap:10px;text-wrap:balance}
.sec h3 svg{flex:none;width:16px;height:16px;color:var(--gold)}
.sec .intro{color:var(--ink-soft);font-size:.95rem;margin-top:4px}
.sec p+p{margin-top:10px}
.sec .body{margin-top:14px}
.minor{font-size:.82rem;color:var(--ink-soft);margin-top:8px}

.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.pillar{display:grid;gap:6px;text-align:center;min-width:0}
.plabel{font-size:.78rem;color:var(--ink-soft);letter-spacing:.04em}
.pillar .cell{display:grid;place-items:center;gap:0;padding:12px 4px 10px;border-radius:14px;background:var(--c);color:var(--on-e);min-width:0}
.pillar .cell b{font-family:var(--f-hanja);font-weight:600;font-size:clamp(1.6rem,8vw,2.2rem);line-height:1.15}
.pillar .cell small{font-size:.75rem;opacity:.85}
.pillar.me .plabel{color:var(--gold);font-weight:700}
.pillar.me .cell{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--gold)}
.pillar.none .cell{background:transparent;border:1.5px dashed var(--line);color:var(--ink-soft);min-height:122px}

.flower{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:18px;align-items:center;margin-top:12px}
@media (max-width:520px){.flower{grid-template-columns:1fr;justify-items:center}}
.flower svg{width:100%;max-width:240px;height:auto}
.legend{display:grid;gap:8px;width:100%}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.legend i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.legend em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.petal-t{font-family:var(--f-hanja);font-weight:600;font-size:13px;fill:var(--ink)}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{padding:3px 12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);font-size:.86rem;color:var(--ink)}

.arch{margin-top:14px;padding:20px 18px;border-radius:20px;background:linear-gradient(160deg,var(--paper-2),var(--paper));border:1px solid var(--gold-soft);text-align:center}
.arch .t{font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--ink);text-wrap:balance}
.arch .m{font-family:var(--f-latin);font-style:italic;color:var(--ink-soft);margin-top:4px;font-size:1.05rem}
.sub-h{font-family:var(--f-display);font-weight:800;font-size:1rem;color:var(--ink);margin-top:22px;display:flex;align-items:center;gap:8px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:10px}
.two>div{min-width:0;padding:14px 16px;border-radius:16px;background:var(--paper-2)}
.two h4{margin:0 0 6px;font-family:var(--f-display);font-weight:800;font-size:.95rem;color:var(--royal)}
.dots li{position:relative;padding-left:16px;margin-top:6px;font-size:.96rem}
.dots li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.step{margin-top:22px;padding:16px 18px;border-radius:16px;border:1px dashed var(--gold);background:var(--paper)}
.step b{display:block;font-family:var(--f-display);font-size:.9rem;color:var(--gold);letter-spacing:.06em;margin-bottom:2px}
.recog{margin-top:6px}
.recog li{padding:10px 14px;margin-top:8px;border-radius:14px;background:var(--paper-2);font-size:.96rem}
.blend{margin-top:20px;padding:14px 16px;border-radius:16px;background:var(--paper-2);font-size:.95rem}

.lack{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.lack .chip{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-e);font-family:var(--f-hanja);font-weight:600;font-size:1.7rem}
.lack>div{min-width:0}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ghost{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--gold);background:var(--paper);color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.ghost:hover{background:var(--paper-2)}
#copyOut{display:none;width:100%;height:44px;margin-top:10px}
.disc{padding:22px 20px 26px;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-soft);line-height:1.7}
.reveal{animation:rv .7s ease both}
@keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{padding-block:6px 40px;text-align:center;font-family:var(--f-latin);font-style:italic;color:var(--ink-soft);font-size:1.05rem}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.spark,.reveal{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 20 20"><path d="M10 0 L12.2 7.8 L20 10 L12.2 12.2 L10 20 L7.8 12.2 L0 10 L7.8 7.8 Z" fill="currentColor"/></symbol>
</svg>
<canvas id="petals" aria-hidden="true"></canvas>

<header class="hero">
  <svg class="castle" viewBox="0 0 300 250" aria-hidden="true">
    <defs>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
    </defs>
    <path d="M0 200 Q60 150 120 185 T230 170 T300 190 L300 250 L0 250Z" fill="var(--roof)" opacity=".25"/>
    <g stroke="var(--line)" stroke-width="1" fill="var(--tower)">
      <rect x="48" y="150" width="20" height="72"/><rect x="242" y="140" width="22" height="82"/>
      <rect x="50" y="182" width="215" height="40"/>
      <rect x="90" y="108" width="28" height="114"/><rect x="195" y="98" width="30" height="124"/>
      <rect x="138" y="68" width="32" height="154"/>
    </g>
    <g fill="var(--roof)">
      <polygon points="44,150 58,114 72,150"/><polygon points="238,140 253,102 268,140"/>
      <polygon points="86,108 104,58 122,108"/><polygon points="191,98 210,44 229,98"/><polygon points="133,68 154,8 175,68"/>

    <g stroke="#c9a45c" stroke-width="1.4"><line x1="154" y1="8" x2="154" y2="-2"/><line x1="210" y1="44" x2="210" y2="34"/><line x1="104" y1="58" x2="104" y2="48"/></g>
    <g fill="#e8c878"><ellipse cx="154" cy="100" rx="3" ry="6"/><ellipse cx="154" cy="140" rx="3" ry="6"/><ellipse cx="104" cy="140" rx="2.6" ry="5"/><ellipse cx="210" cy="132" rx="2.6" ry="5"/><ellipse cx="253" cy="168" rx="2.6" ry="5"/><ellipse cx="58" cy="176" rx="2.6" ry="5"/></g>

  <div class="wrap">
    <div class="hero-in">
      <svg class="crown" viewBox="0 0 64 44" aria-hidden="true">
        <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a80f4"/><stop offset="1" stop-color="#e48fc6"/></linearGradient></defs>
        <path d="M6 36 L9 12 L21 24 L32 6 L43 24 L55 12 L58 36 Z" fill="url(#cg)" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        <rect x="6" y="36" width="52" height="5" rx="2" fill="#e8c878" stroke="#fff" stroke-width="1.5"/>
        <circle cx="9" cy="10" r="3" fill="#e8c878"/><circle cx="32" cy="4.5" r="3.4" fill="#e8c878"/><circle cx="55" cy="10" r="3" fill="#e8c878"/>
      </svg>
      <p class="kicker">생년월일로 펼쳐 보는 나의 동화</p>
      <h1 class="title"><span>별빛 동화</span><span class="sm">사주</span></h1>
      <p class="sub">태어난 순간의 하늘과 마음의 결을 한 권의 이야기로 풀어 드려요.</p>
    </div>
  </div>
  <canvas id="garden" aria-hidden="true"></canvas>
</header>

<main class="wrap">
  <section class="form-card" aria-labelledby="fh">
    <h2 id="fh">당신의 첫 페이지를 열어 주세요</h2>
    <p class="lead">양력 생년월일과 태어난 시간을 적으면 이야기가 시작돼요.</p>
    <form id="f" novalidate>
      <div class="field">
        <label for="name">이름 또는 별명 (선택)</label>
        <input id="name" type="text" maxlength="12" autocomplete="off" placeholder="예) 하늘">
      </div>
      <div class="row">
        <div class="field">
          <label for="date">생년월일 (양력)</label>
          <input id="date" type="date" min="1900-01-01" max="2100-12-31" value="1995-03-15" required>
        </div>
        <div class="field">
          <label for="time">태어난 시간</label>
          <input id="time" type="time" value="14:30">
        </div>
      </div>
      <label class="check" for="unk"><input id="unk" type="checkbox"> 태어난 시간을 몰라요</label>
      <button class="go" type="submit">내 동화 펼치기</button>
      <p class="err" id="err" role="alert"></p>
      <p class="fine">한국 표준시 기준이에요. 시간을 모르면 시주(時柱) 없이 여섯 글자로 풀이해요.</p>
    </form>
  </section>

  <section id="result" aria-live="polite"></section>
</main>
<footer>Once upon a time, it was you.</footer>

<script>
/* =========================================================
   사주 계산 (양력, KST). 절기는 태양 황경으로 직접 계산해요.
   ========================================================= */
const STEM=['갑','을','병','정','무','기','경','신','임','계'];
const STEM_H=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BR=['자','축','인','묘','진','사','오','미','신','유','술','해'];
const BR_H=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const EL=['목','화','토','금','수'];
const EL_H=['木','火','土','金','水'];
const EL_N=['나무','불','흙','쇠','물'];
const ST_EL=[0,0,1,1,2,2,3,3,4,4];
const BR_EL=[4,2,0,0,2,1,1,2,3,3,2,4];
const BR_MAIN=[9,5,0,1,4,2,3,5,6,7,4,8];

function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sunLon(jd){const T=(jd-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*Math.PI/180;
  const lon=L0+C-0.00569-0.00478*Math.sin(om);
  return ((lon%360)+360)%360;}
const mod=(n,m)=>((n%m)+m)%m;

function pillars(y,m,d,h,mi,hasTime){
  const t=hasTime?h*60+mi:12*60;
  const jd=jdn(y,m,d)-0.5+t/1440-9/24;
  const lon=sunLon(jd);
  const k=Math.floor(mod(lon-315,360)/30);
  const ey=(m<=2&&lon<315&&lon>200)?y-1:y;
  const ys=mod(ey-4,10),yb=mod(ey-4,12);
  const ms=mod((ys%5)*2+2+k,10),mb=mod(2+k,12);
  const n=jdn(y,m,d)-2451545;
  const ds=mod(n+4,10),db=mod(n+6,12);
  let hour=null;
  if(hasTime){
    const hb=Math.floor(((t+30)%1440)/120);
    const dsH=t>=1410?mod(n+5,10):ds;
    hour=[mod((dsH%5)*2+hb,10),hb];
  }
  return {year:[ys,yb],month:[ms,mb],day:[ds,db],hour};
}

function catOf(de,o){const eo=ST_EL[o];
  if(eo===de)return 0; if(eo===(de+1)%5)return 1; if(eo===(de+2)%5)return 2;
  if((eo+2)%5===de)return 3; return 4;}

function analyze(p){
  const dm=p.day[0],de=ST_EL[dm],yin=dm%2;
  const tg=[0,0,0,0,0],el=[0,0,0,0,0];
  const addS=(s,w)=>{tg[catOf(de,s)]+=w;};
  const addB=(b,w)=>{tg[catOf(de,BR_MAIN[b])]+=w;};
  addS(p.year[0],1);addS(p.month[0],1);addB(p.year[1],1);addB(p.month[1],2);addB(p.day[1],1.2);
  if(p.hour){addS(p.hour[0],1);addB(p.hour[1],1);}
  [p.year,p.month,p.day,p.hour].forEach(x=>{if(!x)return;el[ST_EL[x[0]]]++;el[BR_EL[x[1]]]++;});
  const tot=tg.reduce((a,b)=>a+b,0);
  const f=tg.map(v=>v/tot);
  const ratio=f[0]+f[4];
  return {dm,de,yin,tg,f,el,ratio};
}

function scoreTypes(a,dayIdx){
  const [b,s,j,g,i]=a.f,e=a.de,y=a.yin,r=a.ratio;
  const strong=Math.max(0,r-0.5)*2,weak=Math.max(0,0.5-r)*2,bal=1-Math.abs(r-0.5)*2;
  const E=k=>e===k?1:0;
  const sc=[
    g*3+i*1+0.4*E(3)+0.2*E(2)+0.3*y+0.2*strong,
    i*2.9+s*1.9+0.7*E(2)+0.3*E(4)+0.5*y+0.5*weak,
    j*2.7+s*1+0.6*E(1)+0.4*(1-y)+0.1*strong,
    s*2.4+i*1.5+0.5*E(4)+0.3*E(0)*y+0.5*y+0.3*weak,
    i*3.2+g*0.5+0.6*E(4)+0.3*E(3)+0.6*weak,
    g*3.1+i*1.2+0.7*E(2)+0.4*E(3)+1.0*weak,
    s*2.6+j*0.8+0.4*E(1)+0.4*E(0)+0.4*(1-y)+0.1*strong,
    b*2.6+g*0.6+0.4*E(3)+0.3*E(1)+0.5*(1-y)+0.7*strong,
    b*1.1+i*1.1+0.8*E(2)+0.3*E(4)+0.7*bal
  ];
  const BIAS=[0.185,-0.196,-0.023,-0.04,0.107,-0.206,0.094,-0.046,0.125];
  return sc.map((v,t)=>v+BIAS[t]+((dayIdx*(t+3))%17)*0.002);
}
function typesOf(a,p){
  const dayIdx=p.day[0]*12+p.day[1];
  const sc=scoreTypes(a,dayIdx);
  const order=sc.map((v,i)=>i).sort((x,y)=>sc[y]-sc[x]);
  return {primary:order[0],secondary:order[1],sc};
}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function pillarHTML(label,pair,me){
  if(!pair)return '<div class="pillar none"><span class="plabel">'+label+'</span><div class="cell"><b>?</b><small>시간 모름</small></div></div>';
  const [s,b]=pair;
  return '<div class="pillar'+(me?' me':'')+'"><span class="plabel">'+label+(me?' · 나':'')+'</span>'+
    '<div class="cell" style="--c:var(--e'+ST_EL[s]+')"><b>'+STEM_H[s]+'</b><small>'+STEM[s]+EL[ST_EL[s]]+'</small></div>'+
    '<div class="cell" style="--c:var(--e'+BR_EL[b]+')"><b>'+BR_H[b]+'</b><small>'+BR[b]+EL[BR_EL[b]]+'</small></div></div>';

function flowerSVG(el){
  let s='<svg viewBox="0 0 240 240" role="img" aria-label="오행 분포를 꽃잎으로 나타낸 그림">';
  for(let i=0;i<5;i++){
    const c=Math.min(el[i],4),len=22+16*c,rx=17;
    s+='<ellipse cx="120" cy="'+(120-len/2)+'" rx="'+rx+'" ry="'+(len/2)+'" transform="rotate('+(i*72)+' 120 120)" fill="var(--e'+i+')" fill-opacity="'+(el[i]?0.92:0.35)+'" stroke="var(--gold)" stroke-opacity=".55" stroke-width="1"/>';
  }
  s+='<circle cx="120" cy="120" r="10" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.5"/>';
  for(let i=0;i<5;i++){
    const a=(i*72-90)*Math.PI/180,x=120+108*Math.cos(a),y=120+108*Math.sin(a)+4.5;
    s+='<text class="petal-t" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle">'+EL_H[i]+' '+el[i]+'</text>';
  }
  return s+'</svg>';
}
function ul(arr,cls){return '<ul class="'+cls+'">'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}

/* ---------- 꽃밭과 꽃잎 ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function flowerAt(c,x,y,r,rot,fill,edge,center){
  for(let k=0;k<5;k++){c.save();c.translate(x,y);c.rotate(rot+k*Math.PI*2/5);c.beginPath();
    c.ellipse(0,-r*0.62,r*0.42,r*0.62,0,0,Math.PI*2);c.fillStyle=fill;c.fill();
    c.strokeStyle=edge;c.lineWidth=Math.max(.6,r*.06);c.stroke();c.restore();}
  c.beginPath();c.arc(x,y,r*0.2,0,Math.PI*2);c.fillStyle=center;c.fill();
}
function drawGarden(cv){
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const R=rng(11),n=Math.round(w/7);
  const pts=[];
  for(let i=0;i<n;i++){
    const x=R()*w,edge=Math.abs(x/w-0.5)*2;
    const up=R()*h*(0.28+0.72*edge*edge);
    pts.push({x,y:h-up+6,s:0.7+R()*0.6,rot:R()*6.28});
  }
  c.fillStyle='rgba(255,255,255,0)';
  pts.forEach(p=>{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.ellipse(0,-10*p.s,5*p.s,13*p.s,0,0,Math.PI*2);
    c.fillStyle=R()>.5?'#cde6d3':'#b9d9dd';c.fill();c.strokeStyle='rgba(70,120,110,.3)';c.lineWidth=.7;c.stroke();c.restore();});
  pts.filter((p,i)=>i%2===0).forEach(p=>flowerAt(c,p.x+R()*10-5,p.y-4,(4.5+R()*3.5)*p.s,p.rot,'#8fb0f0','rgba(60,80,170,.35)','#fff6d6'));
  pts.filter((p,i)=>i%3===1).forEach(p=>flowerAt(c,p.x,p.y-6,(9+R()*8)*p.s,p.rot,'#fffdf6','rgba(130,120,190,.38)','#e8c878'));
}
function startPetals(){
  const cv=document.getElementById('petals'),c=cv.getContext('2d');
  let W=0,Hh=0;const dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){W=window.innerWidth;Hh=window.innerHeight;cv.width=W*dpr;cv.height=Hh*dpr;c.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener('resize',size);
  const R=rng(5),ps=[];
  for(let i=0;i<14;i++)ps.push({x:R()*W,y:R()*Hh,r:4+R()*5,vy:.25+R()*.4,vx:-.1+R()*.35,rot:R()*6,vr:(R()-.5)*.02,ph:R()*6,hue:R()>.5});
  function tick(){
    if(!document.hidden){
      c.clearRect(0,0,W,Hh);
      ps.forEach(p=>{p.y+=p.vy;p.ph+=.012;p.x+=p.vx+Math.sin(p.ph)*.35;p.rot+=p.vr;
        if(p.y>Hh+10){p.y=-10;p.x=Math.random()*W;}if(p.x>W+10)p.x=-10;if(p.x<-10)p.x=W+10;
        c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);
        c.fillStyle=p.hue?'rgba(214,200,250,.75)':'rgba(255,255,255,.8)';c.fill();c.restore();});
    }
    requestAnimationFrame(tick);
  }
  tick();
}

if(typeof document!=='undefined'){
  const $=id=>document.getElementById(id);
  const form=$('f'),unk=$('unk'),time=$('time'),err=$('err'),res=$('result');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY='sjDongwhaInput';
  function readSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}
  function save(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}}

  function show(inp,sample,fresh){
    const r=buildReading(inp);
    res.innerHTML='<div class="book'+(fresh?' reveal':'')+'">'+(sample?'<div class="ribbon">예시 풀이예요. 위에 내 생일을 적으면 내 동화로 바뀌어요.</div>':'')+r.html+'</div>';
    const cp=$('copy'),out=$('copyOut');
    if(cp)cp.addEventListener('click',()=>{
      const done=()=>{cp.textContent='복사했어요';setTimeout(()=>{cp.textContent='내 동화 한 줄 복사';},1800);};
      const fallback=()=>{out.style.display='block';out.value=r.share;out.focus();out.select();};
      try{navigator.clipboard.writeText(r.share).then(done,fallback);}catch(e){fallback();}
    });
  }
  function readForm(){
    const v=$('date').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return {error:'생년월일을 선택해 주세요.'};
    const [y,m,d]=v.split('-').map(Number);
    if(y<1900||y>2100)return {error:'1900년부터 2100년 사이의 날짜를 입력해 주세요.'};
    const dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return {error:'존재하지 않는 날짜예요. 다시 확인해 주세요.'};
    let h=12,mi=0,hasTime=!unk.checked;
    if(hasTime){
      const t=time.value;
      if(!/^\d{2}:\d{2}$/.test(t))return {error:'태어난 시간을 입력하거나 “몰라요”를 체크해 주세요.'};
      [h,mi]=t.split(':').map(Number);
    }
    return {name:$('name').value.trim(),y,m,d,h,mi,hasTime};
  }
  unk.addEventListener('change',()=>{time.disabled=unk.checked;});
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const inp=readForm();
    if(inp.error){err.textContent=inp.error;return;}
    err.textContent='';
    save({...inp,unk:!inp.hasTime});
    show(inp,false,true);
    res.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  });

  const saved=readSaved();
  if(saved&&saved.y){
    $('name').value=saved.name||'';
    $('date').value=String(saved.y).padStart(4,'0')+'-'+String(saved.m).padStart(2,'0')+'-'+String(saved.d).padStart(2,'0');
    if(saved.unk){unk.checked=true;time.disabled=true;}else{time.value=String(saved.h).padStart(2,'0')+':'+String(saved.mi).padStart(2,'0');}
    show(saved,false,false);
  }else{
    show({name:'',y:1995,m:3,d:15,h:14,mi:30,hasTime:true},true,false);
  }

  const g=$('garden');
  drawGarden(g);
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>drawGarden(g),150);});
  if(!reduce)startPetals();
}
</script>

</body></html>
