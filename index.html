<title>별빛 동화 사주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&family=Noto+Serif+KR:wght@600&display=swap">
<style>
/* 레이아웃: 동화책 표지를 펼치듯 하늘 → 성 → 꽃밭 → 책장 순으로 흐르는 단일 세로 컬럼. 결과는 한 권의 책(한 장의 종이)에 장(章)으로 이어 붙인다. */
:root{
  --sky-1:#bcdaf6; --sky-2:#e4f0fc; --sky-3:#fbf7f0;
  --bg:#fbf7f0; --paper:#fffdf8; --paper-2:#f4effb;
  --ink:#2d3158; --ink-soft:#585d8e; --royal:#5f4cc6; --rose:#d68fc2;
  --gold:#b68d42; --gold-soft:#e6d4a3; --line:rgba(95,76,198,.18);
  --roof:#8ea4e8; --tower:rgba(255,255,255,.82);
  --btn-a:#5846c2; --btn-b:#a85aa6;
  --e0:#a9d8b4; --e1:#f4a99b; --e2:#ecd08e; --e3:#cdd6e6; --e4:#9bbcf0;
  --on-e:#2a2d52;
  --shadow:0 12px 34px rgba(90,80,170,.14);
  --f-display:'Nanum Myeongjo','Noto Serif KR',serif;
  --f-body:'Gowun Batang','Noto Serif KR',Georgia,serif;
  --f-latin:'Cormorant Garamond',Georgia,serif;
  --f-hanja:'Noto Serif KR','Nanum Myeongjo',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-1:#171c4a; --sky-2:#34357c; --sky-3:#12163a;
    --bg:#12163a; --paper:#1b2050; --paper-2:#242a62;
    --ink:#eef0ff; --ink-soft:#b9bde8; --royal:#b7a9ff; --rose:#f0a9d8;
    --gold:#e3c27a; --gold-soft:#6d5b36; --line:rgba(190,180,255,.22);
    --roof:#7f94e0; --tower:rgba(226,228,255,.88);
    --shadow:0 12px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky-1:#171c4a; --sky-2:#34357c; --sky-3:#12163a;
  --bg:#12163a; --paper:#1b2050; --paper-2:#242a62;
  --ink:#eef0ff; --ink-soft:#b9bde8; --royal:#b7a9ff; --rose:#f0a9d8;
  --gold:#e3c27a; --gold-soft:#6d5b36; --line:rgba(190,180,255,.22);
  --roof:#7f94e0; --tower:rgba(226,228,255,.88);
  --shadow:0 12px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--royal);outline-offset:3px}
.wrap{width:min(100%,680px);margin-inline:auto;padding-inline:16px}

/* ---------- 표지 ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 62%,var(--sky-3) 100%);padding-block:52px 150px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:
   radial-gradient(60% 22% at 15% 16%,rgba(255,255,255,.85),transparent 70%),
   radial-gradient(50% 18% at 85% 8%,rgba(255,255,255,.7),transparent 70%),
   radial-gradient(70% 20% at 60% 52%,rgba(255,255,255,.55),transparent 72%),
   radial-gradient(40% 16% at 8% 60%,rgba(255,255,255,.5),transparent 72%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero::before{opacity:.18}}
:root[data-theme="dark"] .hero::before{opacity:.18}
.castle{position:absolute;right:-4%;bottom:70px;width:min(64%,420px);height:auto;opacity:.92;z-index:-1}
.hero-in{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:100%}
.crown{width:54px;height:auto;margin-bottom:4px}
.kicker{font-family:var(--f-body);font-size:.95rem;color:var(--ink-soft);letter-spacing:.04em}
.title{font-family:var(--f-display);font-weight:800;line-height:1.08;letter-spacing:-.01em;font-size:clamp(2.7rem,13vw,4.6rem);
  background:linear-gradient(180deg,#8566ee 0%,#c46ec6 62%,#f08fbd 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #fff) drop-shadow(0 0 14px rgba(255,255,255,.95));margin-block:6px 4px}
.title span{display:block}
.title .sm{font-size:.62em;letter-spacing:.2em;padding-left:.1em}
.sub{max-width:21em;color:var(--ink);font-size:1rem}
.spark{position:absolute;width:18px;height:18px;color:#fff;opacity:.9;animation:tw 3.4s ease-in-out infinite}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .spark{color:var(--gold)}}
:root[data-theme="dark"] .spark{color:var(--gold)}
@keyframes tw{0%,100%{transform:scale(.6);opacity:.35}50%{transform:scale(1.1);opacity:1}}
#garden{position:absolute;left:0;bottom:0;width:100%;height:170px;z-index:1;pointer-events:none}

/* ---------- 입력 카드 ---------- */
.form-card{position:relative;z-index:3;margin-top:-86px;background:var(--paper);border-radius:30px 30px 22px 22px;
  box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--gold-soft),var(--shadow);padding:26px 20px 24px}
.form-card h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--royal);text-wrap:balance}
.form-card .lead{color:var(--ink-soft);font-size:.95rem;margin-top:4px}
form{display:grid;gap:16px;margin-top:18px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field .lab{font-size:.85rem;color:var(--ink-soft);letter-spacing:.03em}
input[type=text],input[type=date],input[type=time]{width:100%;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-family:var(--f-body);font-size:1rem}
input:disabled{opacity:.6;background:var(--paper-2)}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink-soft);cursor:pointer;width:max-content;max-width:100%}
.check input{width:18px;height:18px;accent-color:var(--royal)}
.go{height:54px;border:0;border-radius:999px;cursor:pointer;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:.04em;
  background:linear-gradient(100deg,var(--btn-a),var(--btn-b));box-shadow:0 8px 22px rgba(120,80,190,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.go:hover{transform:translateY(-1px)}
.go:active{transform:translateY(1px)}
.err{min-height:1.4em;font-size:.9rem;color:#b3395f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err{color:#ff9db9}}
:root[data-theme="dark"] .err{color:#ff9db9}
.fine{font-size:.8rem;color:var(--ink-soft)}

/* ---------- 결과: 한 권의 책 ---------- */
#result{padding-block:34px 20px}
.book{position:relative;background:var(--paper);border-radius:26px;box-shadow:0 0 0 5px var(--paper),0 0 0 6px var(--gold-soft),var(--shadow);overflow:hidden}
.ribbon{background:linear-gradient(100deg,var(--btn-a),var(--btn-b));color:#fff;text-align:center;font-size:.85rem;padding:7px 12px;letter-spacing:.03em}
.cover{position:relative;text-align:center;padding:40px 20px 32px;background:linear-gradient(180deg,var(--sky-1),var(--paper));isolation:isolate}
.cover .spark{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cover .spark{color:var(--gold)}}
:root[data-theme="dark"] .cover .spark{color:var(--gold)}
.cover .eyebrow{font-family:var(--f-latin);font-style:italic;font-size:1.05rem;color:var(--ink-soft);letter-spacing:.08em}
.cover .who{font-size:1rem;color:var(--ink);margin-top:2px}
.cover h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.9rem,8.5vw,2.7rem);line-height:1.2;margin-block:10px 8px;text-wrap:balance;
  background:linear-gradient(180deg,#8566ee,#c46ec6 70%,#ee8fbd);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 #fff) drop-shadow(0 0 10px rgba(255,255,255,.8))}
.cover .ilji{display:inline-flex;gap:10px;align-items:center;font-family:var(--f-hanja);font-weight:600;color:var(--ink);padding:4px 16px;border:1px solid var(--gold-soft);border-radius:999px;background:var(--paper)}
.cover .line{margin:14px auto 0;max-width:24em;color:var(--ink)}
.sec{padding:30px 20px;border-top:1px solid var(--line)}
.sec h3{font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--royal);display:flex;align-items:center;gap:10px;text-wrap:balance}
.sec h3 svg{flex:none;width:16px;height:16px;color:var(--gold)}
.deep[open]{padding-bottom:30px}
.deep>.sec-sum{list-style:none;cursor:pointer;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--royal);display:flex;align-items:center;gap:10px;text-wrap:balance}
.deep>.sec-sum::-webkit-details-marker{display:none}
.deep>.sec-sum svg{flex:none;width:16px;height:16px;color:var(--gold)}
.deep>.sec-sum .more{margin-left:auto;font-family:var(--f-body);font-weight:600;font-size:0;color:var(--ink-soft);border:1px solid var(--gold);border-radius:999px;padding:3px 12px;white-space:nowrap}
.deep>.sec-sum .more::after{content:"열기";font-size:.8rem}
.deep[open]>.sec-sum .more::after{content:"닫기"}
.sec .intro{color:var(--ink-soft);font-size:.95rem;margin-top:4px}
.sec p+p{margin-top:10px}
.sec .body{margin-top:14px}
.minor{font-size:.82rem;color:var(--ink-soft);margin-top:8px}

.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.pillar{display:grid;gap:6px;text-align:center;min-width:0}
.plabel{font-size:.78rem;color:var(--ink-soft);letter-spacing:.04em}
.pillar .cell{display:grid;place-items:center;gap:0;padding:12px 4px 10px;border-radius:14px;background:var(--c);color:var(--on-e);min-width:0}
.pillar .cell b{font-family:var(--f-hanja);font-weight:600;font-size:clamp(1.6rem,8vw,2.2rem);line-height:1.15}
.pillar .cell small{font-size:.75rem;opacity:.85}
.pillar.me .plabel{color:var(--gold);font-weight:700}
.pillar.me .cell{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--gold)}
.pillar.none .cell{background:transparent;border:1.5px dashed var(--line);color:var(--ink-soft);min-height:122px}

.flower{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:18px;align-items:center;margin-top:12px}
@media (max-width:520px){.flower{grid-template-columns:1fr;justify-items:center}}
.flower svg{width:100%;max-width:240px;height:auto}
.legend{display:grid;gap:8px;width:100%}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:.92rem}
.legend i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.legend em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.petal-t{font-family:var(--f-hanja);font-weight:600;font-size:13px;fill:var(--ink)}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{padding:3px 12px;border-radius:999px;background:var(--paper-2);border:1px solid var(--line);font-size:.86rem;color:var(--ink)}

.arch{margin-top:14px;padding:20px 18px;border-radius:20px;background:linear-gradient(160deg,var(--paper-2),var(--paper));border:1px solid var(--gold-soft);text-align:center}
.arch .t{font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--ink);text-wrap:balance}
.arch .m{font-family:var(--f-latin);font-style:italic;color:var(--ink-soft);margin-top:4px;font-size:1.05rem}
.sub-h{font-family:var(--f-display);font-weight:800;font-size:1rem;color:var(--ink);margin-top:22px;display:flex;align-items:center;gap:8px}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:10px}
.two>div{min-width:0;padding:14px 16px;border-radius:16px;background:var(--paper-2)}
.two h4{margin:0 0 6px;font-family:var(--f-display);font-weight:800;font-size:.95rem;color:var(--royal)}
.dots li{position:relative;padding-left:16px;margin-top:6px;font-size:.96rem}
.dots li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.step{margin-top:22px;padding:16px 18px;border-radius:16px;border:1px dashed var(--gold);background:var(--paper)}
.step b{display:block;font-family:var(--f-display);font-size:.9rem;color:var(--gold);letter-spacing:.06em;margin-bottom:2px}
.recog{margin-top:6px}
.recog li{padding:10px 14px;margin-top:8px;border-radius:14px;background:var(--paper-2);font-size:.96rem}
.blend{margin-top:20px;padding:14px 16px;border-radius:16px;background:var(--paper-2);font-size:.95rem}

.lack{display:flex;gap:14px;align-items:flex-start;margin-top:14px}
.lack .chip{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on-e);font-family:var(--f-hanja);font-weight:600;font-size:1.7rem}
.lack>div{min-width:0}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.ghost{height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--gold);background:var(--paper);color:var(--ink);cursor:pointer;font-family:var(--f-body)}
.ghost:hover{background:var(--paper-2)}
.ghost:disabled{opacity:.45;cursor:not-allowed}
#copyOut{display:none;width:100%;height:44px;margin-top:10px}
.disc{padding:22px 20px 26px;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-soft);line-height:1.7}

select{width:100%;min-width:0;height:50px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-family:var(--f-body);font-size:.95rem}
input[type=number]{width:100%;min-width:0;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);font-family:var(--f-body);font-size:1rem}
.adv{border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.adv summary,.basis summary{cursor:pointer;font-size:.9rem;color:var(--ink-soft)}
.adv .row{margin-top:12px}
.pillar .cell{gap:1px;padding:10px 2px 8px}
.pillar .cell small{line-height:1.3}
.pillar .cell .tg{font-weight:700;opacity:1;margin-top:2px}
.pillar .meta{display:grid;gap:0;font-size:.74rem;color:var(--ink-soft);line-height:1.45}
.pillar .meta .hid{font-family:var(--f-hanja);letter-spacing:.06em}
.tags.center{justify-content:center}
.meter{display:flex;gap:4px;margin-top:16px;font-size:.8rem;line-height:1.35}
.meter span{min-width:0;padding:8px 10px;border-radius:10px;overflow:hidden}
.meter span:first-child{background:var(--e4);color:var(--on-e)}
.meter span:last-child{background:var(--paper-2);color:var(--ink)}
.meter b{display:block;font-weight:700}
.bars{display:grid;gap:12px;margin-top:14px}
.bars li{display:grid;grid-template-columns:3.2em minmax(0,1fr) 3em;gap:4px 10px;align-items:center}
.bars .bn{font-family:var(--f-display);font-weight:800;font-size:.95rem}
.bars .track{height:12px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--c);border-radius:99px}
.bars em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:.9rem}
.bars small{grid-column:2/4;color:var(--ink-soft);font-size:.78rem}
.godp{margin-top:8px}
.rels{display:grid;gap:12px;margin-top:10px}
.rels li{padding:12px 14px;border-radius:14px;background:var(--paper-2);font-size:.95rem}
.rels .minor{margin:0;display:inline-block}
.chip.big{width:52px;height:52px;font-size:1.5rem}
.chip{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--c);color:var(--on-e);font-family:var(--f-hanja);font-weight:600}
.lack .chip{width:58px;height:58px;font-size:1.7rem}
.daeun{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:8px;margin-top:14px}
.dcell{position:relative;display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:14px;background:var(--paper-2);min-width:0}
.dcell .age{font-size:.78rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.dcell .gz{width:40px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--c);color:var(--on-e)}
.dcell .gz b{font-family:var(--f-hanja);font-weight:600;font-size:1.25rem}
.dcell small{font-size:.76rem;color:var(--ink)}
.dcell.now{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--gold)}
.dcell em{font-style:normal;font-size:.7rem;color:var(--gold);font-weight:700;letter-spacing:.06em}
.basis{margin-top:4px}
.notes{margin-top:12px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;line-height:1.6;cursor:pointer}
.consent input{flex:none;width:20px;height:20px;margin-top:.2em;accent-color:var(--royal)}
.consent span{min-width:0}
.terms{border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:.88rem}
.terms summary{cursor:pointer;color:var(--ink-soft)}
.terms .dots{margin-top:6px}
#leadForm{display:grid;gap:14px;margin-top:14px}
.go.sm{height:48px;font-size:1rem}
.go:disabled{opacity:.45;cursor:not-allowed;transform:none}
.err.ok{color:var(--ink-soft)}
.owner{margin-top:18px}
.tbl{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px;max-width:100%}
.tbl table{border-collapse:collapse;width:max-content;min-width:100%;font-size:.8rem}
.tbl th,.tbl td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{background:var(--paper-2);font-weight:700}
.reveal{animation:rv .7s ease both}
@keyframes rv{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{padding-block:6px 40px;text-align:center;font-family:var(--f-latin);font-style:italic;color:var(--ink-soft);font-size:1.05rem}
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.spark,.reveal{animation:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 20 20"><path d="M10 0 L12.2 7.8 L20 10 L12.2 12.2 L10 20 L7.8 12.2 L0 10 L7.8 7.8 Z" fill="currentColor"/></symbol>
</svg>
<canvas id="petals" aria-hidden="true"></canvas>

<header class="hero">
  <svg class="castle" viewBox="0 0 300 250" aria-hidden="true">
    <defs>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".95"/></linearGradient>
    </defs>
    <path d="M0 200 Q60 150 120 185 T230 170 T300 190 L300 250 L0 250Z" fill="var(--roof)" opacity=".25"/>
    <g stroke="var(--line)" stroke-width="1" fill="var(--tower)">
      <rect x="48" y="150" width="20" height="72"/><rect x="242" y="140" width="22" height="82"/>
      <rect x="50" y="182" width="215" height="40"/>
      <rect x="90" y="108" width="28" height="114"/><rect x="195" y="98" width="30" height="124"/>
      <rect x="138" y="68" width="32" height="154"/>
    </g>
    <g fill="var(--roof)">
      <polygon points="44,150 58,114 72,150"/><polygon points="238,140 253,102 268,140"/>
      <polygon points="86,108 104,58 122,108"/><polygon points="191,98 210,44 229,98"/><polygon points="133,68 154,8 175,68"/>

const TERM_Y0=1899;
function yearTerms(y){ // 해당 연도 12절의 JD(UT) 목록
  const i=y-TERM_Y0,out=[];
  const base=2440587.5+Date.UTC(y,0,1)/86400000;
  if(i<0||i>=203){for(let j=0;j<12;j++)out.push(findTerm(mod([285,315,345,15,45,75,105,135,165,195,225,255][j],360),base+[5,34,64,94,125,156,187,218,250,280,311,341][j]));return out;}
  for(let j=0;j<12;j++)out.push(base+parseInt(TERM_DATA.substr(i*48+j*4,4),36)/1440);
  return out;
}
/* jd 기준 직전 절기와 다음 절기. k: 0=입춘월(寅) … 11=소한월(丑) */
function termsAt(jd,y){
  const list=[];
  [y-1,y,y+1].forEach(yy=>yearTerms(yy).forEach((t,j)=>list.push({t,k:(j+11)%12})));
  let i=0;while(i<list.length-1&&list[i+1].t<=jd)i++;
  return {prev:list[i],next:list[i+1]};
}

/* ---------- 한국의 역사적 표준시와 서머타임 ---------- */
const K=(y,m,d,h=0,mi=0)=>Date.UTC(y,m-1,d,h,mi)/60000;
const dowOnOrAfter=(y,m,d0,dow)=>d0+mod(dow-new Date(Date.UTC(y,m-1,d0)).getUTCDay(),7);
function inKoreaDst(y,m,d,h,mi){
  const T=K(y,m,d,h,mi),w=(a,b)=>T>=a&&T<b;
  switch(y){
    case 1948:return w(K(1948,6,1),K(1948,9,13));
    case 1949:return w(K(1949,4,3),K(1949,9,dowOnOrAfter(1949,9,7,6)+1));
    case 1950:return w(K(1950,4,1),K(1950,9,dowOnOrAfter(1950,9,7,6)+1));
    case 1951:return w(K(1951,5,6),K(1951,9,dowOnOrAfter(1951,9,7,6)+1));
    case 1955:return w(K(1955,5,5),K(1955,9,9));
    case 1956:return w(K(1956,5,20),K(1956,9,30));
    case 1957:case 1958:case 1959:case 1960:
      return w(K(y,5,dowOnOrAfter(y,5,1,0)),K(y,9,dowOnOrAfter(y,9,17,6)+1));
    case 1987:case 1988:
      return w(K(y,5,dowOnOrAfter(y,5,8,0),2),K(y,10,dowOnOrAfter(y,10,8,0),3));
  }
  return false;
}
/* 시계 시각 → UTC와의 차이(분) */
function koreaOffset(y,m,d,h,mi){
  const t=K(y,m,d,h,mi);let std=540;
  if(t<K(1908,4,1))std=508;
  else if(t<K(1912,1,1))std=510;
  else if(t<K(1954,3,21))std=540;
  else if(t<K(1961,8,10))std=510;
  return std+(inKoreaDst(y,m,d,h,mi)?60:0);
}

/* ---------- 십성·12운성 ---------- */
function catOf(de,o){const eo=ST_EL[o];
  if(eo===de)return 0;if(eo===(de+1)%5)return 1;if(eo===(de+2)%5)return 2;
  if((eo+2)%5===de)return 3;return 4;}
const godIdx=(dm,o)=>catOf(ST_EL[dm],o)*2+((dm%2===o%2)?0:1);
const godName=(dm,o)=>GODS[catOf(ST_EL[dm],o)][(dm%2===o%2)?0:1];
const GOD_NAME10=[].concat(...GODS);

const idx60=(s,b)=>{for(let i=0;i<60;i++)if(i%10===s&&i%12===b)return i;return 0;};

/* ---------- 사주 네 기둥 ---------- */
function pillarsFrom(inp){
  const S=inp.settings,hasTime=inp.hasTime;
  const clockT=hasTime?inp.h*60+inp.mi:720;
  const clockMin=K(inp.y,inp.m,inp.d)+clockT;
  const offMin=S.place==='other'?S.utcOff*60:koreaOffset(inp.y,inp.m,inp.d,Math.floor(clockT/60),clockT%60);
  const utcMin=clockMin-offMin;
  const jd=2440587.5+utcMin/1440;
  const lmtMin=utcMin+S.lon/15*60;
  const effMin=(hasTime&&S.corr==='lmt')?lmtMin:clockMin;
  const ed=new Date(Math.round(effMin)*60000);
  const ey_=ed.getUTCFullYear(),em_=ed.getUTCMonth()+1,edd=ed.getUTCDate(),eh=ed.getUTCHours(),emi=ed.getUTCMinutes();
  const lateNight=hasTime&&eh>=23;
  let dayJ=jdn(ey_,em_,edd);
  if(lateNight&&S.zasi==='next')dayJ+=1;
  const n=dayJ-2451545,ds=mod(n+4,10),db=mod(n+6,12);
  const lon=sunLon(jd);
  const ts=termsAt(jd,inp.y),k=ts.prev.k;
  const ipchun=yearTerms(inp.y)[1];
  const ey=jd>=ipchun?inp.y:inp.y-1;
  const ys=mod(ey-4,10),yb=mod(ey-4,12);
  const ms=mod((ys%5)*2+2+k,10),mb=mod(2+k,12);
  let hour=null,t=0;
  if(hasTime){
    t=eh*60+emi;
    const hb=Math.floor(((t+60)%1440)/120);
    const dsH=(lateNight&&S.zasi==='night')?mod(n+5,10):ds;
    hour=[mod((dsH%5)*2+hb,10),hb];
  }
  const tPrev=ts.prev.t,tNext=ts.next.t;
  return {p:{year:[ys,yb],month:[ms,mb],day:[ds,db],hour},jd,lon,k,offMin,utcMin,clockMin,effMin,eff:{y:ey_,m:em_,d:edd,h:eh,mi:emi},
    tPrev,tNext,prevName:TERMS[k],nextName:TERMS[(k+1)%12],nextK:ts.next.k,hourEdge:hasTime?Math.min(mod(t+60,120),120-mod(t+60,120)):99,lateNight,ey};
}

/* ---------- 세력 분석 ---------- */
function analyze(p){
  const dm=p.day[0],de=ST_EL[dm],yin=dm%2;
  const tg=Array(10).fill(0),el=Array(5).fill(0);
  const addS=(s,w)=>{tg[godIdx(dm,s)]+=w;el[ST_EL[s]]+=w;};
  const addB=(b,w)=>HID[b].forEach(([s,dy])=>{const x=w*dy/30;tg[godIdx(dm,s)]+=x;el[ST_EL[s]]+=x;});
  addS(p.year[0],8);addS(p.month[0],12);addB(p.year[1],8);addB(p.month[1],30);addB(p.day[1],14);
  if(p.hour){addS(p.hour[0],10);addB(p.hour[1],10);}
  el[de]+=12;
  const tgTot=tg.reduce((a,b)=>a+b,0),elTot=el.reduce((a,b)=>a+b,0);

  const ratio=(tg[0]+tg[1]+tg[8]+tg[9]+12)/(tgTot+12); // 일간 자신(12)을 나를 돕는 쪽에 포함
  const level=ratio>=0.72?'xstrong':ratio>=0.56?'strong':ratio>=0.46?'mid':ratio>=0.34?'weak':'xweak';
  const mel=BR_EL[p.month[1]];
  const deukryeong=(mel===de)||((mel+1)%5===de);
  const elShare=el.map(v=>v/elTot);
  // 격국: 월지 정기의 십성

}

function yongsin(a,p){
  const de=a.de,E=a.el,sh=a.elShare,mb=p.month[1];
  const eSik=(de+1)%5,eJae=(de+2)%5,eGwan=(de+3)%5,eIn=(de+4)%5,eBi=de;
  const lowest=(arr)=>arr.slice().sort((x,y)=>E[x]-E[y]||arr.indexOf(x)-arr.indexOf(y));
  let ob,sec,avoid,kind;
  if(a.level==='strong'||a.level==='xstrong'){const c=lowest([eSik,eJae,eGwan]);ob=c[0];sec=c[1];avoid=[eIn,eBi];kind='strong';}
  else if(a.level==='weak'||a.level==='xweak'){const c=lowest([eIn,eBi]);ob=c[0];sec=c[1];
    avoid=[eGwan,eSik,eJae].sort((x,y)=>E[y]-E[x]).slice(0,2);kind='weak';}
  else{const c=lowest([0,1,2,3,4]);ob=c[0];sec=c[1];avoid=[[0,1,2,3,4].sort((x,y)=>E[y]-E[x])[0]];kind='mid';}
  let climate=null;
  if([11,0,1].includes(mb)&&sh[1]<0.16)climate=1;
  if([5,6,7].includes(mb)&&sh[4]<0.16)climate=4;
  let primary=ob,secondary=sec;
  if(climate!==null&&climate!==ob){primary=climate;secondary=ob;}
  else if(climate!==null){primary=climate;}
  avoid=avoid.filter(e=>e!==primary&&e!==secondary);
  return {primary,secondary,avoid,climate,kind};
}

/* ---------- 합·충·형, 신살, 공망 ---------- */
const HE6=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
const CHUNG=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
const XING=[[2,5],[5,8],[2,8],[1,10],[10,7],[1,7],[0,3]];
const SELFX=[4,6,9,11];
const TRI=[[8,0,4,4,'수'],[11,3,7,0,'목'],[2,6,10,1,'화'],[5,9,1,3,'금']];
const POS=['연','월','일','시'];
const POS_MEAN={'01':'어린 시절의 환경과 사회·직업의 터전','02':'뿌리(초년·가문)와 나 자신(배우자궁)','03':'뿌리(초년·가문)와 자녀·말년','12':'사회·직업의 환경과 나의 내면(배우자궁)','13':'사회 활동과 자녀·말년','23':'나 자신과 자녀·말년'};
function pairTypes(a,b){
  const t=[];
  if(HE6.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)))t.push('합');
  if(CHUNG.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a)))t.push('충');
  if(XING.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a))||(a===b&&SELFX.includes(a)))t.push('형');
  return t;
}
function relations(p){
  const br=[p.year[1],p.month[1],p.day[1],p.hour?p.hour[1]:null],out=[];
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    if(br[i]===null||br[j]===null)continue;
    pairTypes(br[i],br[j]).forEach(t=>out.push({t,a:i,b:j,ba:br[i],bb:br[j]}));
  }
  const tri=[];
  TRI.forEach(([x,y,z,c,el])=>{
    const has=[x,y,z].filter(b=>br.includes(b));
    if(has.length===3)tri.push({full:true,set:[x,y,z],el});
    else if(has.length===2&&has.includes([x,y,z][1]))tri.push({full:false,set:has,el});
  });
  const st=[[p.year[0],0],[p.month[0],1],[p.day[0],2],[p.hour?p.hour[0]:null,3]];
  const stems=[];
  const HAP=[[0,5,2],[1,6,3],[2,7,4],[3,8,0],[4,9,1]];
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){
    const a=st[i][0],b=st[j][0];if(a===null||b===null)continue;
    HAP.forEach(([x,y,e])=>{if((a===x&&b===y)||(a===y&&b===x))stems.push({a:i,b:j,sa:a,sb:b,el:e});});
  }
  return {pairs:out,tri,stems};
}
const GUIIN={0:[1,7],4:[1,7],6:[1,7],1:[0,8],5:[0,8],2:[11,9],3:[11,9],7:[2,6],8:[5,3],9:[5,3]};
const grp=b=>b===8||b===0||b===4?0:b===11||b===3||b===7?1:b===2||b===6||b===10?2:3;
const DOHWA=[9,0,3,6],YEOKMA=[2,5,8,11],HWAGAE=[4,7,10,1];
function sinsal(p){
  const br=[p.year[1],p.month[1],p.day[1],p.hour?p.hour[1]:null];
  const res=[];
  const hit=(name,targets)=>{const where=[];br.forEach((b,i)=>{if(b!==null&&targets.includes(b)&&!(i===2&&false))where.push(POS[i]+'지');});if(where.length)res.push({name,where});};
  const g=new Set([...(GUIIN[p.day[0]]||[]),...(GUIIN[p.year[0]]||[])]);
  hit('천을귀인',[...g]);
  const gd=grp(p.day[1]),gy=grp(p.year[1]);
  hit('도화살',[...new Set([DOHWA[gd],DOHWA[gy]])]);
  hit('역마살',[...new Set([YEOKMA[gd],YEOKMA[gy]])]);
  hit('화개살',[...new Set([HWAGAE[gd],HWAGAE[gy]])]);
  return res;
}
function gongmang(p){
  const i=idx60(p.day[0],p.day[1]),start=Math.floor(i/10)*10,s=start%12;
  const empty=[mod(s+10,12),mod(s+11,12)];
  const where=[];
  [[p.year[1],'연지'],[p.month[1],'월지'],[p.hour?p.hour[1]:null,'시지']].forEach(([b,n])=>{if(b!==null&&empty.includes(b))where.push(n);});
  return {empty,where};
}

/* ---------- 대운 ---------- */
function daeun(c,inp,p,now){
  if(!inp.gender)return null;
  const forward=(p.year[0]%2===0)===(inp.gender==='M');
  const tj=forward?c.tNext:c.tPrev;
  const days=Math.abs(tj-c.jd);
  const yrs=Math.floor(days/3),months=Math.floor((days/3-yrs)*12);
  const i0=idx60(p.month[0],p.month[1]);
  const cycles=[];
  for(let n=0;n<8;n++){
    const idx=mod(i0+(forward?1:-1)*(n+1),60);
    cycles.push({s:idx%10,b:idx%12,from:yrs+10*n,to:yrs+10*n+9});
  }
  const bd=new Date(Date.UTC(inp.y,inp.m-1,inp.d));
  const age=(now.getTime()-bd.getTime())/(365.2425*86400000);
  const start=yrs+months/12;
  let cur=-1;
  if(age>=start)cur=Math.min(7,Math.floor((age-start)/10));
  return {forward,yrs,months,cycles,cur,age,start};
}

/* ---------- 전체 계산 ---------- */
function compute(inp,now){
  now=now||new Date();
  const c=pillarsFrom(inp),p=c.p;
  const a=analyze(p),ys=yongsin(a,p);
  const rel=relations(p),ss=sinsal(p),gm=gongmang(p);
  const dae=daeun(c,inp,p,now);
  const cy=pillarsFrom({y:now.getFullYear(),m:now.getMonth()+1,d:now.getDate(),h:12,mi:0,hasTime:true,settings:{place:'korea',lon:126.98,corr:'clock',zasi:'night',utcOff:9}});
  return {c,p,a,ys,rel,ss,gm,dae,cur:cy.p,curYear:cy.ey};
}

  return d.getUTCFullYear()+'.'+(d.getUTCMonth()+1)+'.'+d.getUTCDate()+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}

function flowerSVG(share){
  let s='<svg viewBox="0 0 240 240" role="img" aria-label="오행 분포를 꽃잎으로 나타낸 그림">';
  for(let i=0;i<5;i++){
    const len=22+Math.min(share[i],0.4)/0.4*64,rx=17;
    s+='<ellipse cx="120" cy="'+(120-len/2).toFixed(1)+'" rx="'+rx+'" ry="'+(len/2).toFixed(1)+'" transform="rotate('+(i*72)+' 120 120)" fill="var(--e'+i+')" fill-opacity="'+(share[i]>0.02?0.92:0.35)+'" stroke="var(--gold)" stroke-opacity=".55" stroke-width="1"/>';
  }
  s+='<circle cx="120" cy="120" r="10" fill="var(--paper)" stroke="var(--gold)" stroke-width="1.5"/>';
  for(let i=0;i<5;i++){
    const a=(i*72-90)*Math.PI/180,x=120+108*Math.cos(a),y=120+108*Math.sin(a)+4.5;
    s+='<text class="petal-t" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" text-anchor="middle">'+EL_H[i]+' '+pct(share[i])+'</text>';
  }
  return s+'</svg>';
}

    profile:{name:inp.name||'',gender:inp.gender||'',birth:inp.y+'-'+two(inp.m)+'-'+two(inp.d),time:inp.hasTime?two(inp.h)+':'+two(inp.mi):'',place:placeName},
    reading:{year:pn(p.year),month:pn(p.month),day:pn(p.day),hour:pn(p.hour),dm:STEM[dm]+EL[a.de],strength:L.n,gyeok:(a.gyeokKind==='rok'?'건록격':a.gyeokKind==='in'?'양인격':a.gyeok+'격'),yongsin:EL[ys.primary]}
  };
  return {html:cover+s1+s2+s3+sNow+s4+s5+s6+s7+s8+s9+(opts.lead?lead:'')+disc,share,record};
}

/* ---------- 꽃밭과 꽃잎 ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function flowerAt(c,x,y,r,rot,fill,edge,center){
  for(let k=0;k<5;k++){c.save();c.translate(x,y);c.rotate(rot+k*Math.PI*2/5);c.beginPath();
    c.ellipse(0,-r*0.62,r*0.42,r*0.62,0,0,Math.PI*2);c.fillStyle=fill;c.fill();
    c.strokeStyle=edge;c.lineWidth=Math.max(.6,r*.06);c.stroke();c.restore();}
  c.beginPath();c.arc(x,y,r*0.2,0,Math.PI*2);c.fillStyle=center;c.fill();
}
function drawGarden(cv){
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const c=cv.getContext('2d');c.scale(dpr,dpr);
  const R=rng(11),n=Math.round(w/7);
  const pts=[];
  for(let i=0;i<n;i++){
    const x=R()*w,edge=Math.abs(x/w-0.5)*2;
    const up=R()*h*(0.28+0.72*edge*edge);
    pts.push({x,y:h-up+6,s:0.7+R()*0.6,rot:R()*6.28});
  }
  pts.forEach(p=>{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.ellipse(0,-10*p.s,5*p.s,13*p.s,0,0,Math.PI*2);
    c.fillStyle=R()>.5?'#cde6d3':'#b9d9dd';c.fill();c.strokeStyle='rgba(70,120,110,.3)';c.lineWidth=.7;c.stroke();c.restore();});
  pts.filter((p,i)=>i%2===0).forEach(p=>flowerAt(c,p.x+R()*10-5,p.y-4,(4.5+R()*3.5)*p.s,p.rot,'#8fb0f0','rgba(60,80,170,.35)','#fff6d6'));
  pts.filter((p,i)=>i%3===1).forEach(p=>flowerAt(c,p.x,p.y-6,(9+R()*8)*p.s,p.rot,'#fffdf6','rgba(130,120,190,.38)','#e8c878'));
}
function startPetals(){
  const cv=document.getElementById('petals'),c=cv.getContext('2d');
  let W=0,Hh=0;const dpr=Math.min(2,window.devicePixelRatio||1);
  function size(){W=window.innerWidth;Hh=window.innerHeight;cv.width=W*dpr;cv.height=Hh*dpr;c.setTransform(dpr,0,0,dpr,0,0);}
  size();window.addEventListener('resize',size);
  const R=rng(5),ps=[];
  for(let i=0;i<14;i++)ps.push({x:R()*W,y:R()*Hh,r:4+R()*5,vy:.25+R()*.4,vx:-.1+R()*.35,rot:R()*6,vr:(R()-.5)*.02,ph:R()*6,hue:R()>.5});
  function tick(){
    if(!document.hidden){
      c.clearRect(0,0,W,Hh);
      ps.forEach(p=>{p.y+=p.vy;p.ph+=.012;p.x+=p.vx+Math.sin(p.ph)*.35;p.rot+=p.vr;
        if(p.y>Hh+10){p.y=-10;p.x=Math.random()*W;}if(p.x>W+10)p.x=-10;if(p.x<-10)p.x=W+10;
        c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.beginPath();c.ellipse(0,0,p.r,p.r*.55,0,0,Math.PI*2);
        c.fillStyle=p.hue?'rgba(214,200,250,.75)':'rgba(255,255,255,.8)';c.fill();c.restore();});
    }
    requestAnimationFrame(tick);
  }
  tick();
}

/* ---------- 입력 폼 ---------- */
const PLACES=[['seoul','서울',126.98],['incheon','인천',126.70],['suwon','수원·경기',127.03],['chuncheon','춘천',127.73],['gangneung','강릉',128.90],
  ['daejeon','대전',127.38],['sejong','세종',127.29],['cheongju','청주',127.49],['jeonju','전주',127.15],['gwangju','광주',126.85],['mokpo','목포',126.39],
  ['daegu','대구',128.60],['andong','안동',128.73],['pohang','포항',129.37],['ulsan','울산',129.31],['busan','부산',129.08],['changwon','창원',128.68],['jinju','진주',128.11],['jeju','제주',126.53]];
if(typeof document!=='undefined'){
  const $=id=>document.getElementById(id);
  const form=$('f'),unk=$('unk'),time=$('time'),err=$('err'),res=$('result'),placeSel=$('place');
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const KEY='sjDongwhaInput2';
  PLACES.forEach(([k,n])=>{const o=document.createElement('option');o.value=k;o.textContent=n;placeSel.appendChild(o);});
  function readSaved(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}}
  function save(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}}
  const defSettings={place:'seoul',lon:126.98,corr:'lmt',zasi:'night',utcOff:9};

  function show(inp,sample,fresh){
    const r=buildReading(inp,new Date(),{lead:!sample});
    res.innerHTML='<div class="book'+(fresh?' reveal':'')+'">'+(sample?'<div class="ribbon">예시 풀이예요. 위에 내 생일을 적으면 내 사주로 바뀌어요.</div>':'')+r.html+'</div>';
    initLead(r.record);
    const cp=$('copy'),out=$('copyOut');
    if(cp)cp.addEventListener('click',()=>{
      const done=()=>{cp.textContent='복사했어요';setTimeout(()=>{cp.textContent='내 동화 한 줄 복사';},1800);};
      const fallback=()=>{out.style.display='block';out.value=r.share;out.focus();out.select();};
      try{navigator.clipboard.writeText(r.share).then(done,fallback);}catch(e){fallback();}
    });
  }
  /* ---------- 소식 받기 (db 기능이 있는 화면에서만 나타나요) ---------- */
  const LEAD_VER='2026-10-13';
  let capP=null;
  function caps(){
    if(!capP){const c=window.claude;
      capP=(c&&c.use)?Promise.all([c.use('db'),c.use('user')]).then(([db,user])=>({db,user}),()=>({db:null,user:null})):Promise.resolve({db:null,user:null});}
    return capP;
  }
  const maskContact=(v,k)=>k==='email'?v.replace(/^(.).*(@.*)$/,'$1***$2'):v.replace(/^(\d{3})-\d{3,4}-(\d{4})$/,'$1-****-$2');
  function parseContact(raw){
    const v=raw.trim();
    if(v.length<=120&&/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v))return {kind:'email',value:v.toLowerCase()};
    const d=v.replace(/[\s-]/g,'');
    if(/^01[016789]\d{7,8}$/.test(d)){const l=d.length===10?3:4;return {kind:'phone',value:d.slice(0,3)+'-'+d.slice(3,3+l)+'-'+d.slice(3+l)};}
    return null;
  }
  const safeCell=v=>{const s=String(v==null?'':v);return /^[=+\-@\t\r]/.test(s)?"'"+s:s;};
  function loadXlsx(){
    return new Promise((ok,no)=>{
      if(window.XLSX)return ok(window.XLSX);
      const sc=document.createElement('script');
      sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      const t=setTimeout(()=>no(new Error('xlsx')),6000);
      sc.onload=()=>{clearTimeout(t);window.XLSX?ok(window.XLSX):no(new Error('xlsx'));};sc.onerror=()=>{clearTimeout(t);no(new Error('xlsx'));};
      document.head.appendChild(sc);
    });
  }
  async function exportRows(rows,msgEl){
    const stamp=new Date().toISOString().slice(0,10).replace(/-/g,'');
    const clean=rows.map(r=>r.map(safeCell));
    msgEl.textContent='파일을 만드는 중이에요.';
    let dl=null;
    try{dl=await window.claude.use('downloads');}catch(e){}
    if(!dl){msgEl.textContent='이 화면에서는 파일을 내려받을 수 없어요.';return;}
    try{
      let res;
      try{
        const X=await loadXlsx();
        const ws=X.utils.aoa_to_sheet(clean);
        ws['!cols']=clean[0].map((h,i)=>({wch:Math.min(30,Math.max(10,...clean.slice(0,50).map(r=>String(r[i]).length+2)))}));
        const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'등록 목록');
        res=await dl.save({filename:'별빛동화사주_등록목록_'+stamp+'.xlsx',data:X.write(wb,{bookType:'xlsx',type:'array'})});
      }catch(e){
        if(e&&e.code)throw e;
        const csv='\uFEFF'+clean.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
        res=await dl.save({filename:'별빛동화사주_등록목록_'+stamp+'.csv',data:csv});
      }
      msgEl.textContent=res.status==='saved'?'파일을 저장했어요. 엑셀이나 구글 스프레드시트에서 열 수 있어요.':'';
    }catch(e){
      msgEl.textContent=(e&&e.code==='declined')?'저장을 취소했어요.':'파일을 저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
    }
  }
  async function initLead(rec){
    const box=$('lead');if(!box)return;
    const {db,user}=await caps();
    if($('lead')!==box)return;
    const off=t=>{const n=$('leadNote');n.textContent=t;n.hidden=false;['c1','c2','contact','leadGo'].forEach(k=>{$(k).disabled=true;});};
    if(!db||!user){off('이 화면에서는 등록 기능을 쓸 수 없어요. Claude에 로그인한 상태에서 공유받은 링크를 열면 입력할 수 있어요.');return;}
    let id=null;try{id=await user.id();}catch(e){}
    if($('lead')!==box)return;
    if(!id){off('등록은 Claude에 로그인한 상태에서만 가능해요. 로그인 후 다시 열어 주세요.');return;}
    const ref=db.doc('leads/'+id);
    const c1=$('c1'),c2=$('c2'),inp=$('contact'),go=$('leadGo'),msg=$('leadMsg'),msg2=$('leadMsg2'),form=$('leadForm'),done=$('leadDone'),cancel=$('leadCancel'),doneTxt=$('leadDoneTxt');
    let data=null;
    try{const s=await ref.get();if(s.exists)data=s.data();}catch(e){}
    if($('lead')!==box)return;
        const paint=()=>{form.hidden=!!data;done.hidden=!data;if(data)doneTxt.textContent='등록되어 있어요 · '+maskContact(data.contact,data.kind);};
    paint();
    const sync=()=>{const ok=c1.checked&&c2.checked;inp.disabled=!ok;go.disabled=!ok;inp.placeholder=ok?'예) name@example.com 또는 010-1234-5678':'위 두 항목에 체크하면 입력할 수 있어요';};
    c1.addEventListener('change',sync);c2.addEventListener('change',sync);sync();
    const owner=await user.isOwner();
    const COLS=['등록일시','이름','성별','생년월일','태어난 시각','출생지','연락처 종류','연락처','연주','월주','일주','시주','일간','신강·신약','격국','용신','개인정보 수집·이용 동의','광고성 정보 수신 동의','동의 문구 버전'];
    const GL={M:'남자',F:'여자'};
    const rowOf=x=>{const p=x.profile||{},r=x.reading||{},c=x.consent||{};
      return [c.at?String(c.at).replace('T',' ').slice(0,16):'',p.name||'',GL[p.gender]||'미선택',p.birth||'',p.time||'모름',p.place||'',x.kind==='email'?'이메일':'휴대폰',x.contact||'',r.year||'',r.month||'',r.day||'',r.hour||'',r.dm||'',r.strength||'',r.gyeok||'',r.yongsin||'',c.privacy?'동의':'',c.marketing?'동의':'',c.version||''];};
    const loadOwner=async()=>{
      if(!owner)return;
      const wrap=$('leadOwner'),tb=$('leadTable');
      wrap.hidden=false;
      try{
        const qs=await db.collection('leads').get();
        const rows=qs.docs.map(d=>d.data()||{}).map(rowOf).sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
        tb.textContent='';
        const shown=[0,1,2,3,4,7,10,15];
        const thead=document.createElement('thead'),hr=document.createElement('tr');
        shown.forEach(i=>{const th=document.createElement('th');th.textContent=COLS[i];hr.appendChild(th);});
        thead.appendChild(hr);tb.appendChild(thead);
        const tbody=document.createElement('tbody');
        rows.slice(0,200).forEach(r=>{const tr=document.createElement('tr');shown.forEach(i=>{const td=document.createElement('td');td.textContent=r[i];tr.appendChild(td);});tbody.appendChild(tr);});
        tb.appendChild(tbody);
        $('leadCount').textContent=rows.length?'지금까지 '+rows.length+'건이 등록됐어요. 표에는 일부 항목만 보이고, 내려받는 파일에는 모든 항목이 들어가요.':'아직 등록한 사람이 없어요.';
        $('leadSheet').disabled=!rows.length;
        $('leadSheet').onclick=()=>exportRows([COLS].concat(rows),$('leadSheetMsg'));
      }catch(e){$('leadCount').textContent='목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.';}
    };
    loadOwner();
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      msg.className='err';
      if(!c1.checked||!c2.checked){msg.textContent='두 가지 동의에 모두 체크하면 등록할 수 있어요.';return;}
      const p=parseContact(inp.value);
      if(!p){msg.textContent='이메일 주소나 휴대폰 번호 형식을 확인해 주세요.';return;}
      go.disabled=true;msg.className='err ok';msg.textContent='등록하는 중이에요.';
      const next={contact:p.value,kind:p.kind,profile:rec.profile,reading:rec.reading,consent:{privacy:true,marketing:true,version:LEAD_VER,at:new Date().toISOString()}};
      try{
        await ref.set(next);
        data=next;paint();msg.textContent='';msg2.textContent='등록했어요. 새 소식이 있으면 알려 드릴게요.';
        loadOwner();
      }catch(e2){
        msg.className='err';
        msg.textContent=(e2&&e2.code==='invalid_argument')?'이 화면에서는 연락처를 등록할 수 없어요. 등록 권한이 있는 계정으로 열어 주세요.':'등록하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
        go.disabled=false;
      }
    });
    cancel.addEventListener('click',async()=>{
      cancel.disabled=true;
      try{
        await ref.delete();
        data=null;paint();inp.value='';c1.checked=false;c2.checked=false;sync();
        msg.className='err ok';msg.textContent='등록을 취소했어요. 보관하던 연락처는 삭제됐어요.';
        loadOwner();
      }catch(e){msg2.textContent='취소하지 못했어요. 잠시 뒤 다시 시도해 주세요.';}
      cancel.disabled=false;
    });
  }
  function readForm(){
    const v=$('date').value;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return {error:'생년월일을 선택해 주세요.'};
    const [y,m,d]=v.split('-').map(Number);
    if(y<1900||y>2100)return {error:'1900년부터 2100년 사이의 날짜를 입력해 주세요.'};
    const dt=new Date(y,m-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return {error:'존재하지 않는 날짜예요. 다시 확인해 주세요.'};
    let h=12,mi=0;const t=time.value;
    const hasTime=!unk.checked&&/^\d{2}:\d{2}$/.test(t);
    if(hasTime){[h,mi]=t.split(':').map(Number);}
    let S={place:placeSel.value,corr:$('corr').value,zasi:$('zasi').value,utcOff:9,lon:126.98};
    const pl=PLACES.find(p=>p[0]===S.place)||PLACES.find(p=>p[0]==='seoul');
    S.place=pl[0];S.lon=pl[2];
    return {name:$('name').value.trim(),y,m,d,h,mi,hasTime,gender:$('gender').value,settings:S};
  }
  function fill(s){
    $('name').value=s.name||'';
    $('date').value=String(s.y).padStart(4,'0')+'-'+String(s.m).padStart(2,'0')+'-'+String(s.d).padStart(2,'0');
    if(!s.hasTime){unk.checked=true;time.disabled=true;}else{time.value=String(s.h).padStart(2,'0')+':'+String(s.mi).padStart(2,'0');}
    $('gender').value=s.gender||'';
    const S=s.settings||defSettings;
    placeSel.value=(S.place==='other'?'seoul':S.place);
    $('corr').value=S.corr;$('zasi').value=S.zasi;
  }
  unk.addEventListener('change',()=>{time.disabled=unk.checked;});
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const inp=readForm();
    if(inp.error){err.textContent=inp.error;if(err.scrollIntoView)err.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});return;}
    err.textContent='';
    try{
      save(inp);
      show(inp,false,true);
    }catch(ex){
      err.textContent='풀이를 그리는 중 문제가 생겼어요. 입력을 확인하고 다시 시도해 주세요. ('+(ex&&ex.message?ex.message:'오류')+')';
      if(err.scrollIntoView)err.scrollIntoView({behavior:'auto',block:'center'});
      return;
    }
    if(res.scrollIntoView)res.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  });

  const saved=readSaved();
  if(saved&&saved.y&&saved.settings){fill(saved);show(saved,false,false);}
  else{
    placeSel.value='seoul';
    show({name:'',y:1995,m:3,d:15,h:14,mi:30,hasTime:true,gender:'F',settings:defSettings},true,false);
  }

  const g=$('garden');
  drawGarden(g);
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>drawGarden(g),150);});
  if(!reduce)startPetals();
}
